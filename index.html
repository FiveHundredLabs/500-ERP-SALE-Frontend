<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="S &amp; K Enterprises — Enterprise Hardware &amp; Automotive ERP Management System" />
    <title>S &amp; K Enterprises | ERP Business Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('erp_theme');
          if (saved === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>

    <style>
      /* Universal box model & Inter font */
      *, *::before, *::after {
        box-sizing: border-box;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      html, body {
        background-color: #0f172a;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
        width: 100%;
      }

      /* Hide arrows/spinners on number inputs */
      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none !important; 
        margin: 0 !important; 
      }
      input[type=number] {
        -moz-appearance: textfield !important;
        appearance: textfield !important;
      }

      /* Native dark date picker */
      input[type="date"],
      input[type="time"],
      input[type="datetime-local"] {
        color-scheme: dark;
      }
      input[type="date"]::-webkit-calendar-picker-indicator,
      input[type="time"]::-webkit-calendar-picker-indicator {
        filter: invert(0.8) brightness(1.2);
        cursor: pointer;
        opacity: 0.7;
      }

      /* Custom scrollbars */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #475569; }

      .sidebar-nav { scrollbar-width: none; -ms-overflow-style: none; }
      .sidebar-nav::-webkit-scrollbar { display: none; }

      /* Base Animations */
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideIn { from { transform: translateY(-8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: calc(200px + 100%) 0; } }

      .animate-fadeIn { animation: fadeIn 0.2s ease-out both; }
      .animate-slideIn { animation: slideIn 0.25s ease-out; }
      .animate-spin { animation: spin 1s linear infinite; }
      .animate-pulse { animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; }

      /* Skeleton loader */
      .skeleton-text {
        height: 0.875rem;
        border-radius: 4px;
        background: linear-gradient(90deg, #1e293b 25%, #243349 50%, #1e293b 75%);
        background-size: 200px 100%;
        animation: shimmer 1.5s infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
